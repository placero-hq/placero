<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />

    <title>PlaceRo — Jobs, Internships & Fresher Openings</title>
    <meta id="meta-description" name="description" content="Find the latest jobs, internships and fresher openings on PlaceRo." />
    <meta id="meta-robots" name="robots" content="index, follow" />
    <link rel="canonical" id="canonical-link" href="https://placero.in/" />

    <!-- Open Graph (defaults; overridden per-page by src/lib/seo.js) -->
    <meta id="og-type" property="og:type" content="website" />
    <meta id="og-site-name" property="og:site_name" content="PlaceRo" />
    <meta id="og-title" property="og:title" content="PlaceRo — Jobs, Internships & Fresher Openings" />
    <meta id="og-description" property="og:description" content="Find the latest jobs, internships and fresher openings on PlaceRo." />
    <meta id="og-url" property="og:url" content="https://placero.in/" />
    <meta id="og-image" property="og:image" content="https://placero.in/og-default.png" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta id="twitter-card" name="twitter:card" content="summary_large_image" />
    <meta id="twitter-title" name="twitter:title" content="PlaceRo — Jobs, Internships & Fresher Openings" />
    <meta id="twitter-description" name="twitter:description" content="Find the latest jobs, internships and fresher openings on PlaceRo." />
    <meta id="twitter-image" name="twitter:image" content="https://placero.in/og-default.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Site-wide entity data: stable, so it's static (not injected via JS) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "PlaceRo",
        "url": "https://placero.in/",
        "logo": "https://placero.in/favicon.png"
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "PlaceRo",
        "url": "https://placero.in/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://placero.in/jobs?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
